name: Validate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check PyYAML cryptography

      - name: Validate YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in (Path("repository.yaml"), Path("hyundai_battery_insight/config.yaml")):
              with path.open("r", encoding="utf-8") as handle:
                  value = yaml.safe_load(handle)
              if not isinstance(value, dict):
                  raise SystemExit(f"{path} did not parse to a mapping")
              print(f"OK: {path}")
          PY

      - name: Compile Python
        run: python -m py_compile hyundai_battery_insight/app/server.py

      - name: Validate shell script
        run: bash -n hyundai_battery_insight/run.sh

      - name: Test reinstall-safe raw protection
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("hyundai_battery_insight/app/server.py")

          def load_module(name):
              spec = importlib.util.spec_from_file_location(name, path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module

          first = load_module("hbi_first")
          vin = "AAAAAAAAAAAAAAAAA"
          payload = {"VIN": vin, "Electronics": {"Battery": {"Level": 65}}}
          protected = first.protect_raw_payload(payload, vin)
          assert protected
          assert first.decrypt_raw_payload(protected, vin) == payload

          # Simulate a fresh install/process: reload the code with no shared state.
          second = load_module("hbi_second")
          assert second.decrypt_raw_payload(protected, vin) == payload

          try:
              second.decrypt_raw_payload(protected, "BBBBBBBBBBBBBBBBB")
          except Exception:
              pass
          else:
              raise AssertionError("payload decrypted with a different VIN")

          print("reinstall-safe raw protection: OK")
          PY

      - name: Test full data backup and restore
        run: |
          python - <<'PY'
          import importlib.util
          import tempfile
          from pathlib import Path

          path = Path("hyundai_battery_insight/app/server.py")
          spec = importlib.util.spec_from_file_location("hbi_backup_test", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          with tempfile.TemporaryDirectory() as tmp:
              module.DATA_DIR = Path(tmp)
              module.DB_PATH = module.DATA_DIR / "hbi.db"
              module.init_db()

              vin = "AAAAAAAAAAAAAAAAA"
              raw = module.protect_raw_payload(
                  {"VIN": vin, "Electronics": {"Battery": {"Level": 65}}},
                  vin,
              )
              snapshot = {
                  "source_ts": "2026-09-29T08:00:00+00:00",
                  "received_ts": "2026-09-29T08:00:01+00:00",
                  "aux_soc": 65.0,
                  "ev_soc": 72.0,
                  "ev_soh": None,
                  "odometer": 16684.8,
                  "ev_range": None,
                  "warning_level": 65.0,
                  "sensor_reliability": None,
                  "aux_fail_warning": None,
                  "battery_pre_warning": None,
                  "power_state_class_c": None,
                  "sleep_mode": None,
                  "driving_ready": None,
                  "accessory": None,
                  "ignition1": None,
                  "ignition3": None,
                  "connector_fastening": None,
                  "charging_remain_time": None,
                  "ev_charging": None,
                  "raw_json": raw,
              }
              module.upsert_snapshot(snapshot)
              module.upsert_history_point({
                  "source_ts": "2026-09-14T08:00:00+00:00",
                  "aux_soc": 58.0,
                  "ev_soc": 80.0,
                  "odometer": 16640.0,
                  "aux_source_ts": "2026-09-14T08:00:00+00:00",
                  "ev_source_ts": "2026-09-14T07:59:30+00:00",
                  "odometer_source_ts": "2026-09-14T07:59:00+00:00",
                  "imported_ts": "2026-09-14T08:01:00+00:00",
              })

              backup = module.raw_backup_document()
              assert backup["format"] == module.DATA_BACKUP_FORMAT
              assert backup["snapshot_count"] == 1
              assert backup["history_point_count"] == 1
              assert backup["vehicle_fingerprint"] == module._vin_fingerprint(vin)
              assert backup["snapshots"][0]["raw_json"] == raw
              assert backup["ha_history_points"][0]["aux_soc"] == 58.0

              with module.db() as conn:
                  conn.execute("DELETE FROM snapshots")
                  conn.execute("DELETE FROM ha_history_points")
                  conn.commit()

              result = module.restore_raw_backup_document(backup)
              assert result["inserted"] == 1
              assert result["updated"] == 0
              assert result["history_inserted"] == 1
              with module.db() as conn:
                  row = conn.execute(
                      "SELECT aux_soc, odometer, raw_json FROM snapshots"
                  ).fetchone()
                  hist = conn.execute(
                      "SELECT aux_soc, ev_soc, odometer FROM ha_history_points"
                  ).fetchone()
              assert row["aux_soc"] == 65.0
              assert row["odometer"] == 16684.8
              assert row["raw_json"] == raw
              assert hist["aux_soc"] == 58.0
              assert hist["ev_soc"] == 80.0
              assert hist["odometer"] == 16640.0

          print("full data backup/restore: OK")
          PY

      - name: Test additive three-stream history rebuild
        run: |
          python - <<'PY'
          import datetime as dt
          import importlib.util
          import tempfile
          from pathlib import Path

          path = Path("hyundai_battery_insight/app/server.py")
          spec = importlib.util.spec_from_file_location("hbi_history_test", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          def event(ts, value):
              parsed = dt.datetime.fromisoformat(ts.replace("Z", "+00:00"))
              return {"ts": parsed.isoformat(), "dt": parsed, "value": value}

          with tempfile.TemporaryDirectory() as tmp:
              module.DATA_DIR = Path(tmp)
              module.DB_PATH = module.DATA_DIR / "hbi.db"
              module.init_db()

              # Cached evidence that is no longer returned by Recorder must survive.
              module.upsert_history_point({
                  "source_ts": "2026-09-14T08:00:00+00:00",
                  "aux_soc": 55.0,
                  "ev_soc": 81.0,
                  "odometer": 16640.0,
                  "aux_source_ts": "2026-09-14T08:00:00+00:00",
                  "ev_source_ts": "2026-09-14T07:59:30+00:00",
                  "odometer_source_ts": "2026-09-14T07:59:00+00:00",
                  "imported_ts": "2026-09-14T08:01:00+00:00",
              })

              entities = {
                  "aux_soc": "sensor.aux",
                  "hv_battery": "sensor.hv",
                  "odometer": "sensor.odo",
              }
              module.resolve_history_entities = lambda: entities
              streams = {
                  "sensor.aux": [event("2026-09-15T08:00:00+00:00", 60.0)],
                  "sensor.hv": [event("2026-09-15T08:00:20+00:00", 80.0)],
                  "sensor.odo": [event("2026-09-15T08:00:40+00:00", 16640.0)],
              }
              module._history_events = lambda entity, start, now: streams.get(entity, [])

              start = dt.datetime(2026, 9, 1, tzinfo=dt.timezone.utc)
              now = dt.datetime(2026, 9, 29, tzinfo=dt.timezone.utc)
              result = module.import_correlated_history(start, now)

              assert result["inserted"] == 1
              assert result["source_events"]["aux_soc"]["count"] == 1
              with module.db() as conn:
                  rows = conn.execute(
                      "SELECT source_ts, aux_soc, ev_soc, odometer "
                      "FROM ha_history_points ORDER BY source_ts"
                  ).fetchall()
              assert len(rows) == 2
              assert rows[0]["source_ts"] == "2026-09-14T08:00:00+00:00"
              assert rows[0]["aux_soc"] == 55.0
              assert rows[1]["aux_soc"] == 60.0
              assert rows[1]["ev_soc"] == 80.0
              assert rows[1]["odometer"] == 16640.0

          print("additive three-stream rebuild: OK")
          PY

      - name: Check UI day selector
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path("hyundai_battery_insight/app/index.html").read_text(encoding="utf-8")
          match = re.search(r'<select id="days">(.*?)</select>', html)
          assert match, "days selector not found"
          values = [int(v) for v in re.findall(r'<option(?: selected)?>(\d+)</option>', match.group(1))]
          assert values == [1, 7, 14, 30, 60, 90], values
          assert 'id="rawBackup"' in html
          assert 'id="rawRestore"' in html
          assert 'id="historyRebuild"' in html
          assert 'Data backup' in html
          print("UI day selector, data backup and history rebuild controls: OK")
          PY

      - name: Check app presentation files
        run: |
          test -f hyundai_battery_insight/icon.png
          test -f hyundai_battery_insight/logo.png
          test -f hyundai_battery_insight/README.md
          test -f hyundai_battery_insight/DOCS.md
          test -f hyundai_battery_insight/CHANGELOG.md
