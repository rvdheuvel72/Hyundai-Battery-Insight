name: Validate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require add-on version bump for runtime changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          import re

          base = os.environ['BASE_SHA']
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', base, 'HEAD'], text=True
          ).splitlines()
          runtime = [p for p in changed if p.startswith('hyundai_battery_insight/')
                     and p != 'hyundai_battery_insight/config.yaml']
          if runtime:
              old_text = subprocess.check_output(
                  ['git', 'show', f'{base}:hyundai_battery_insight/config.yaml'], text=True
              )
              new_text = Path('hyundai_battery_insight/config.yaml').read_text()
              def version(content):
                  match = re.search(r'^version:\\s*[\"\']?(\\d+\\.\\d+\\.\\d+)', content, re.M)
                  if not match:
                      raise SystemExit('Cannot determine add-on version')
                  return match.group(1)
              old, new = version(old_text), version(new_text)
              def parts(v):
                  return tuple(map(int, str(v).split('.')))
              if parts(new) <= parts(old):
                  raise SystemExit(f'Runtime files changed but add-on version not bumped: {old} -> {new}. Files: {runtime}')
              print(f'Add-on version bumped: {old} -> {new}')
          else:
              print('No runtime change requires an add-on version bump')
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check PyYAML cryptography

      - name: Validate YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in (Path("repository.yaml"), Path("hyundai_battery_insight/config.yaml")):
              with path.open("r", encoding="utf-8") as handle:
                  value = yaml.safe_load(handle)
              if not isinstance(value, dict):
                  raise SystemExit(f"{path} did not parse to a mapping")
              print(f"OK: {path}")
          PY

      - name: Compile Python
        run: python -m py_compile hyundai_battery_insight/app/server.py

      - name: Validate shell script
        run: bash -n hyundai_battery_insight/run.sh

      - name: Test reinstall-safe raw protection
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("hyundai_battery_insight/app/server.py")

          def load_module(name):
              spec = importlib.util.spec_from_file_location(name, path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module

          first = load_module("hbi_first")
          vin = "AAAAAAAAAAAAAAAAA"
          payload = {"VIN": vin, "Electronics": {"Battery": {"Level": 65}}}
          protected = first.protect_raw_payload(payload, vin)
          assert protected
          assert first.decrypt_raw_payload(protected, vin) == payload

          # Simulate a fresh install/process: reload the code with no shared state.
          second = load_module("hbi_second")
          assert second.decrypt_raw_payload(protected, vin) == payload

          try:
              second.decrypt_raw_payload(protected, "BBBBBBBBBBBBBBBBB")
          except Exception:
              pass
          else:
              raise AssertionError("payload decrypted with a different VIN")

          print("reinstall-safe raw protection: OK")
          PY

      - name: Test full data backup and restore
        run: |
          python - <<'PY'
          import importlib.util
          import tempfile
          from pathlib import Path

          path = Path("hyundai_battery_insight/app/server.py")
          spec = importlib.util.spec_from_file_location("hbi_backup_test", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          with tempfile.TemporaryDirectory() as tmp:
              module.DATA_DIR = Path(tmp)
              module.DB_PATH = module.DATA_DIR / "hbi.db"
              module.init_db()

              vin = "AAAAAAAAAAAAAAAAA"
              raw = module.protect_raw_payload(
                  {"VIN": vin, "Electronics": {"Battery": {"Level": 65}}},
                  vin,
              )
              snapshot = {
                  "source_ts": "2026-09-29T08:00:00+00:00",
                  "received_ts": "2026-09-29T08:00:01+00:00",
                  "aux_soc": 65.0,
                  "ev_soc": 72.0,
                  "ev_soh": None,
                  "odometer": 16684.8,
                  "ev_range": None,
                  "warning_level": 65.0,
                  "sensor_reliability": None,
                  "aux_fail_warning": None,
                  "battery_pre_warning": None,
                  "power_state_class_c": None,
                  "sleep_mode": None,
                  "driving_ready": None,
                  "accessory": None,
                  "ignition1": None,
                  "ignition3": None,
                  "connector_fastening": None,
                  "charging_remain_time": None,
                  "ev_charging": None,
                  "raw_json": raw,
              }
              module.upsert_snapshot(snapshot)
              module.upsert_history_point({
                  "source_ts": "2026-09-14T08:00:00+00:00",
                  "aux_soc": 58.0,
                  "ev_soc": 80.0,
                  "odometer": 16640.0,
                  "aux_source_ts": "2026-09-14T08:00:00+00:00",
                  "ev_source_ts": "2026-09-14T07:59:30+00:00",
                  "odometer_source_ts": "2026-09-14T07:59:00+00:00",
                  "imported_ts": "2026-09-14T08:01:00+00:00",
              })

              backup = module.raw_backup_document()
              assert backup["format"] == module.DATA_BACKUP_FORMAT
              assert backup["snapshot_count"] == 1
              assert backup["history_point_count"] == 1
              assert backup["vehicle_fingerprint"] == module._vin_fingerprint(vin)
              assert backup["snapshots"][0]["raw_json"] == raw
              assert backup["ha_history_points"][0]["aux_soc"] == 58.0
              assert backup["ha_history_points"][0]["source_kind"] == "ha_history"

              with module.db() as conn:
                  conn.execute("DELETE FROM snapshots")
                  conn.execute("DELETE FROM ha_history_points")
                  conn.commit()

              result = module.restore_raw_backup_document(backup)
              assert result["inserted"] == 1
              assert result["updated"] == 0
              assert result["history_inserted"] == 1
              with module.db() as conn:
                  row = conn.execute(
                      "SELECT aux_soc, odometer, raw_json FROM snapshots"
                  ).fetchone()
                  hist = conn.execute(
                      "SELECT aux_soc, ev_soc, odometer FROM ha_history_points"
                  ).fetchone()
              assert row["aux_soc"] == 65.0
              assert row["odometer"] == 16684.8
              assert row["raw_json"] == raw
              assert hist["aux_soc"] == 58.0
              assert hist["ev_soc"] == 80.0
              assert hist["odometer"] == 16640.0

          print("full data backup/restore: OK")
          PY

      - name: Test additive three-stream history rebuild
        run: |
          python - <<'PY'
          import datetime as dt
          import importlib.util
          import tempfile
          from pathlib import Path

          path = Path("hyundai_battery_insight/app/server.py")
          spec = importlib.util.spec_from_file_location("hbi_history_test", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          def event(ts, value):
              parsed = dt.datetime.fromisoformat(ts.replace("Z", "+00:00"))
              return {"ts": parsed.isoformat(), "dt": parsed, "value": value}

          with tempfile.TemporaryDirectory() as tmp:
              module.DATA_DIR = Path(tmp)
              module.DB_PATH = module.DATA_DIR / "hbi.db"
              module.init_db()

              # Cached evidence that is no longer returned by Recorder must survive.
              module.upsert_history_point({
                  "source_ts": "2026-09-14T08:00:00+00:00",
                  "aux_soc": 55.0,
                  "ev_soc": 81.0,
                  "odometer": 16640.0,
                  "aux_source_ts": "2026-09-14T08:00:00+00:00",
                  "ev_source_ts": "2026-09-14T07:59:30+00:00",
                  "odometer_source_ts": "2026-09-14T07:59:00+00:00",
                  "imported_ts": "2026-09-14T08:01:00+00:00",
              })

              entities = {
                  "aux_soc": "sensor.aux",
                  "hv_battery": "sensor.hv",
                  "odometer": "sensor.odo",
              }
              module.resolve_history_entities = lambda: entities
              streams = {
                  "sensor.aux": [event("2026-09-15T08:00:00+00:00", 60.0)],
                  "sensor.hv": [event("2026-09-15T08:00:20+00:00", 80.0)],
                  "sensor.odo": [event("2026-09-15T08:00:40+00:00", 16640.0)],
              }
              module._history_events = lambda entity, start, now: streams.get(entity, [])

              start = dt.datetime(2026, 9, 1, tzinfo=dt.timezone.utc)
              now = dt.datetime(2026, 9, 29, tzinfo=dt.timezone.utc)
              result = module.import_correlated_history(start, now)

              assert result["inserted"] == 1
              assert result["source_events"]["aux_soc"]["count"] == 1
              with module.db() as conn:
                  rows = conn.execute(
                      "SELECT source_ts, aux_soc, ev_soc, odometer "
                      "FROM ha_history_points ORDER BY source_ts"
                  ).fetchall()
              assert len(rows) == 2
              assert rows[0]["source_ts"] == "2026-09-14T08:00:00+00:00"
              assert rows[0]["aux_soc"] == 55.0
              assert rows[1]["aux_soc"] == 60.0
              assert rows[1]["ev_soc"] == 80.0
              assert rows[1]["odometer"] == 16640.0

          print("additive three-stream rebuild: OK")
          PY

      - name: Test long-term statistics selected-period rebuild
        run: |
          python - <<'PY'
          import datetime as dt
          import importlib.util
          import tempfile
          from pathlib import Path

          path = Path("hyundai_battery_insight/app/server.py")
          spec = importlib.util.spec_from_file_location("hbi_statistics_test", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          def event(ts, value):
              parsed = dt.datetime.fromisoformat(ts.replace("Z", "+00:00"))
              return {
                  "ts": parsed.isoformat(),
                  "dt": parsed,
                  "value": value,
                  "kind": "ha_history",
              }

          with tempfile.TemporaryDirectory() as tmp:
              module.DATA_DIR = Path(tmp)
              module.DB_PATH = module.DATA_DIR / "hbi.db"
              module.init_db()

              entities = {
                  "aux_soc": "sensor.aux",
                  "hv_battery": "sensor.hv",
                  "odometer": "sensor.odo",
              }
              module.resolve_history_entities = lambda: entities

              detailed = {
                  "sensor.aux": [event("2026-09-22T08:00:00+00:00", 61.0)],
                  "sensor.hv": [event("2026-09-22T08:00:20+00:00", 77.0)],
                  "sensor.odo": [event("2026-09-22T08:00:40+00:00", 16645.0)],
              }
              module._history_events = (
                  lambda entity, start, now: detailed.get(entity, [])
              )

              def fake_post(path, payload):
                  assert path == "/services/recorder/get_statistics?return_response"
                  assert payload["period"] == "hour"
                  assert set(payload["statistic_ids"]) == {
                      "sensor.aux", "sensor.hv", "sensor.odo"
                  }
                  return {
                      "changed_states": [],
                      "service_response": {
                          "statistics": {
                              "sensor.aux": [
                                  {
                                      "start": "2026-09-14T08:00:00+00:00",
                                      "mean": 54.0, "min": 54.0, "max": 54.0,
                                  },
                                  {
                                      "start": "2026-09-15T08:00:00+00:00",
                                      "mean": 52.0, "min": 52.0, "max": 52.0,
                                  },
                              ],
                              "sensor.hv": [
                                  {
                                      "start": "2026-09-14T08:00:00+00:00",
                                      "mean": 81.0,
                                  },
                                  {
                                      "start": "2026-09-15T08:00:00+00:00",
                                      "mean": 80.0,
                                  },
                              ],
                              "sensor.odo": [
                                  {
                                      "start": "2026-09-14T08:00:00+00:00",
                                      "state": 16640.0,
                                  },
                                  {
                                      "start": "2026-09-15T08:00:00+00:00",
                                      "state": 16640.0,
                                  },
                              ],
                          }
                      },
                  }

              module.api_post = fake_post
              start = dt.datetime(2026, 9, 1, tzinfo=dt.timezone.utc)
              now = dt.datetime(2026, 9, 29, tzinfo=dt.timezone.utc)
              result = module.import_correlated_history(
                  start, now, include_statistics=True
              )

              assert result["statistics_error"] is None
              assert result["long_term_source_events"]["aux_soc"]["count"] == 2
              assert result["detailed_source_events"]["aux_soc"]["count"] == 1

              with module.db() as conn:
                  rows = [
                      dict(r) for r in conn.execute(
                          "SELECT source_ts, aux_soc, ev_soc, odometer, source_kind "
                          "FROM ha_history_points ORDER BY source_ts"
                      ).fetchall()
                  ]
              assert any(
                  r["source_ts"].startswith("2026-09-14T08:00:00")
                  and r["source_kind"] == "ha_statistics"
                  and r["aux_soc"] == 54.0
                  for r in rows
              )
              assert any(
                  r["source_ts"].startswith("2026-09-15T08:00:00")
                  and r["source_kind"] == "ha_statistics"
                  and r["aux_soc"] == 52.0
                  for r in rows
              )
              assert any(
                  r["source_ts"].startswith("2026-09-22T08:00:")
                  and r["source_kind"] == "ha_history"
                  for r in rows
              )

              captured = {}
              def fake_import(start, now, include_statistics=False):
                  captured["start"] = start
                  captured["now"] = now
                  captured["include_statistics"] = include_statistics
                  return {"inserted": 0}

              module.import_correlated_history = fake_import
              rebuilt = module.rebuild_correlated_history(30)
              assert rebuilt["days"] == 30
              assert captured["include_statistics"] is True
              delta = captured["now"] - captured["start"]
              assert 29.99 < delta.total_seconds() / 86400 < 30.01

          print("long-term statistics selected-period rebuild: OK")
          PY

      - name: Test explicit timeline ranges
        run: |
          python - <<'PY'
          import datetime as dt
          import importlib.util
          import tempfile
          from pathlib import Path

          path = Path("hyundai_battery_insight/app/server.py")
          spec = importlib.util.spec_from_file_location("hbi_range_test", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          def snapshot(ts, aux):
              return {
                  "source_ts": ts,
                  "received_ts": ts,
                  "aux_soc": aux,
                  "ev_soc": 70.0,
                  "ev_soh": None,
                  "odometer": 16000.0,
                  "ev_range": None,
                  "warning_level": None,
                  "sensor_reliability": None,
                  "aux_fail_warning": None,
                  "battery_pre_warning": None,
                  "power_state_class_c": None,
                  "sleep_mode": None,
                  "driving_ready": None,
                  "accessory": None,
                  "ignition1": None,
                  "ignition3": None,
                  "connector_fastening": None,
                  "charging_remain_time": None,
                  "ev_charging": None,
                  "raw_json": None,
              }

          with tempfile.TemporaryDirectory() as tmp:
              module.DATA_DIR = Path(tmp)
              module.DB_PATH = module.DATA_DIR / "hbi.db"
              module.init_db()

              module.upsert_snapshot(snapshot(
                  "2026-09-13T12:00:00+00:00", 60.0
              ))
              module.upsert_snapshot(snapshot(
                  "2026-09-15T12:00:00+00:00", 58.0
              ))
              module.upsert_snapshot(snapshot(
                  "2026-09-18T12:00:00+00:00", 56.0
              ))
              module.upsert_history_point({
                  "source_ts": "2026-09-16T12:00:00+00:00",
                  "aux_soc": 57.0,
                  "ev_soc": 70.0,
                  "odometer": 16000.0,
                  "aux_source_ts": "2026-09-16T12:00:00+00:00",
                  "ev_source_ts": "2026-09-16T12:00:00+00:00",
                  "odometer_source_ts": "2026-09-16T12:00:00+00:00",
                  "imported_ts": "2026-09-16T12:01:00+00:00",
                  "source_kind": "ha_history",
              })

              start = dt.datetime(
                  2026, 9, 14, 0, 0, tzinfo=dt.timezone.utc
              )
              end = dt.datetime(
                  2026, 9, 17, 0, 0, tzinfo=dt.timezone.utc
              )
              rows, intervals, raw = module.query_timeline_range(start, end)
              assert [r["source_ts"] for r in raw] == [
                  "2026-09-15T12:00:00+00:00"
              ]
              assert [r["source_ts"] for r in rows] == [
                  "2026-09-15T12:00:00+00:00",
                  "2026-09-16T12:00:00+00:00",
              ]
              assert len(intervals) == 1

              resolved_start, resolved_end = module._request_range({
                  "start": ["2026-09-14T00:00:00+00:00"],
                  "end": ["2026-09-17T00:00:00+00:00"],
              }, 90)
              assert resolved_start == start
              assert resolved_end == end

              captured = {}
              def fake_import(a, b, include_statistics=False):
                  captured["start"] = a
                  captured["end"] = b
                  captured["statistics"] = include_statistics
                  return {"inserted": 0}

              module.import_correlated_history = fake_import
              result = module.rebuild_correlated_history_range(start, end)
              assert result["start"] == start.isoformat()
              assert result["end"] == end.isoformat()
              assert captured["start"] == start
              assert captured["end"] == end
              assert captured["statistics"] is True

              try:
                  module._validated_range(
                      start, start + dt.timedelta(days=367)
                  )
              except ValueError:
                  pass
              else:
                  raise AssertionError("range longer than 366 days was accepted")

          print("explicit timeline ranges: OK")
          PY

      - name: Test interval peak uncertainty and small movements
        run: |
          python - <<'PY'
          import csv
          import datetime as dt
          import importlib.util
          import io
          from pathlib import Path

          path = Path("hyundai_battery_insight/app/server.py")
          spec = importlib.util.spec_from_file_location("hbi_intervals_test", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          def row(ts, aux, hv, km):
              return {
                  "source_ts": ts, "aux_soc": aux, "ev_soc": hv,
                  "odometer": km, "source_kind": "raw",
                  "charging_remain_time": None,
              }

          points = [
              row("2026-10-19T16:50:00+00:00", 70, 100, 1000),
              row("2026-10-19T17:14:00+00:00", 85, 100, 1002),
              row("2026-10-20T09:51:00+00:00", 63, 99, 1002.2),
          ]
          intervals = [
              module.classify(a, b) for a, b in zip(points, points[1:])
          ]
          assert intervals[0]["event_type"] == "movement_window"
          assert intervals[1]["event_type"] == "decline_minor_movement"
          assert intervals[1]["aux_delta"] == -22
          assert intervals[1]["odo_delta"] == 0.2
          assert "piek" in intervals[1]["unknown"]
          # 0.2 km must not reset the 'since last trip' baseline.
          summary = module.since_last_trip_context(points, intervals)
          assert summary["highest_recorded_aux_soc"] == 85
          assert summary["aux_end"] == 63
          assert summary["aux_delta"] == -22
          assert summary["actual_peak_aux_soc_known"] is False

          exported = module.interval_export_rows(points, intervals)
          assert len(exported) == 2
          assert exported[1]["aux_soc_start"] == 85
          assert exported[1]["aux_soc_end"] == 63
          assert exported[1]["real_peak_12v_soc"] == "unknown"
          assert exported[1]["source_quality"] == "raw"

          start = dt.datetime(2026, 10, 19, tzinfo=dt.timezone.utc)
          end = dt.datetime(2026, 10, 21, tzinfo=dt.timezone.utc)
          doc = module.interval_export_document(points, intervals, start, end)
          assert doc["range"]["start"] == start.isoformat()
          assert doc["interval_count"] == 2
          assert doc["intervals"] == exported
          output = io.StringIO()
          writer = csv.DictWriter(
              output, fieldnames=module.INTERVAL_EXPORT_COLUMNS
          )
          writer.writeheader()
          writer.writerows(exported)
          contents = list(csv.DictReader(io.StringIO(output.getvalue())))
          assert len(contents) == 2
          assert contents[1]["aux_delta_pp"] == "-22"
          assert contents[1]["real_peak_12v_soc"] == "unknown"

          # A 12V decline must not be masked by a simultaneous HV increase.
          concurrent = module.classify(
              row("2026-10-18T12:00:00+00:00", 65, 45, 1002),
              row("2026-10-19T12:00:00+00:00", 55, 46, 1002),
          )
          assert concurrent["event_type"] == "decline_no_ride"
          assert not module.interval_export_rows([], [])
          print("interval analysis and unknown peak exports: OK")
          PY

      - name: Test raw location freshness and shopping outings
        run: python scripts/test_raw_location_and_outings.py

      - name: Test grouped journeys and P2 regressions
        run: |
          python - <<'PY'
          import datetime as dt
          import importlib.util
          from pathlib import Path

          spec = importlib.util.spec_from_file_location(
              "hbi_journey_test", Path("hyundai_battery_insight/app/server.py")
          )
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)

          def point(hhmm, odo, soc):
              return {
                  "source_ts": "2026-10-20T" + hhmm + ":00+00:00",
                  "odometer": odo, "aux_soc": soc, "ev_soc": 80,
                  "source_kind": "raw", "charging_remain_time": None
              }
          samples = [
              point("09:00", 2000.0, 65),
              point("09:10", 2000.6, 67),
              point("09:20", 2001.4, 69),
              point("09:30", 2002.2, 71),
              point("10:10", 2002.2, 65),
              point("10:20", 2002.4, 70),
          ]
          intervals = [
              m.classify(a, b) for a, b in zip(samples, samples[1:])
          ]
          journeys = m.group_journeys(samples, intervals)
          assert len(journeys) == 1
          assert journeys[0]["distance_km"] == 2.2
          assert journeys[0]["measurement_count"] == 4
          assert [it["event_type"] for it in intervals[:3]] == ["movement_window"] * 3
          assert [it["journey_interval_index"] for it in intervals[:3]] == [1, 2, 3]
          assert len({it["journey_id"] for it in intervals[:3]}) == 1
          assert intervals[4]["event_type"] == "recovery_minor_movement"
          assert "journey_id" not in intervals[4]
          summary = m.since_last_trip_context(samples, intervals)
          assert summary["available"] is True
          assert summary["last_trip_distance"] == 2.2
          assert summary["baseline_ts"] == samples[3]["source_ts"]
          assert summary["recovery_events"] == 1

          exported = m.interval_export_rows(samples, intervals)
          assert len(exported) == len(intervals)
          assert len([x for x in exported if x["journey_id"]]) == 3
          assert exported[4]["journey_id"] is None
          doc = m.interval_export_document(
              samples, intervals,
              dt.datetime(2026, 10, 20, tzinfo=dt.timezone.utc),
              dt.datetime(2026, 10, 21, tzinfo=dt.timezone.utc),
          )
          assert len(doc["journeys"]) == 1

          # An isolated parking repositioning does not become a ride.
          short = [
              point("11:00", 3000, 85),
              point("11:10", 3000.2, 63),
          ]
          short_intervals = [m.classify(*short)]
          assert not m.group_journeys(short, short_intervals)
          assert short_intervals[0]["event_type"] == "decline_minor_movement"

          # A long gap splits journeys rather than fabricating continuity.
          samples2 = samples[:4] + [point("12:30", 2010, 68)]
          ints2 = [
              m.classify(a, b) for a, b in zip(samples2, samples2[1:])
          ]
          js2 = m.group_journeys(samples2, ints2)
          assert len(js2) == 2
          assert js2[0]["measurement_count"] == 4
          assert js2[1]["measurement_count"] == 2
          print("grouped journeys + P2 regressions: OK")
          PY

      - name: Test Codex review gate (offline)
        run: python scripts/codex_review_gate.py --self-test

      - name: Check UI day selector
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path("hyundai_battery_insight/app/index.html").read_text(encoding="utf-8")
          match = re.search(r'<select id="days">(.*?)</select>', html)
          assert match, "days selector not found"
          values = [int(v) for v in re.findall(r'<option(?: selected)?>(\d+)</option>', match.group(1))]
          assert values == [1, 7, 14, 30, 60, 90], values
          assert 'id="rawBackup"' in html
          assert 'id="rawRestore"' in html
          assert 'id="historyRebuild"' in html
          assert 'id="prevRange"' in html
          assert 'id="todayRange"' in html
          assert 'id="nextRange"' in html
          assert 'id="intervalCsv"' in html
          assert 'id="intervalJson"' in html
          assert 'id="journeys"' in html
          assert 'renderJourneys(DATA.journeys||[])' in html
          assert 'api/intervals.csv?' in html
          assert 'api/intervals.json?' in html
          assert "'stroke-dasharray':'4 5'" in html
          assert 'id="fromDate"' in html
          assert 'id="toDate"' in html
          assert 'id="applyRange"' in html
          assert '<option selected>14</option>' in html
          assert 'Data backup' in html
          print("UI day selector, range navigation, custom dates and backup controls: OK")
          PY

      - name: Check app presentation files
        run: |
          test -f hyundai_battery_insight/icon.png
          test -f hyundai_battery_insight/logo.png
          test -f hyundai_battery_insight/README.md
          test -f hyundai_battery_insight/DOCS.md
          test -f hyundai_battery_insight/CHANGELOG.md

  codex_review:
    name: Codex review complete and clean
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Codex review of the exact PR head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/codex_review_gate.py
