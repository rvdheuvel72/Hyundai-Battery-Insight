name: Publish v0.1.12 release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v0.1.12.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create v0.1.12 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          Hyundai Battery Insight 0.1.12

          Timeline navigation and custom date-range release.

          Highlights:
          - Adds Previous / Today / Next navigation for fixed 1/7/14/30/60/90-day windows.
          - Adds custom From / To date selection.
          - Uses a 14-day default view for a less crowded timeline.
          - The chart x-axis represents the complete visible range, including gaps without measurements.
          - CSV/JSON exports follow exactly the visible date range.
          - "Herbouw HA-historie" rebuilds exactly the visible date range, including custom ranges.
          - Custom ranges are limited to 366 days and cannot end in the future.
          - Adds automated tests for explicit date ranges and the new timeline controls.

          Raw CCS2 snapshots remain preferred over detailed Recorder history and long-term statistics.

          Status: experimental.
          EOF

          gh release create v0.1.12 \
            --repo "$GITHUB_REPOSITORY" \
            --target 16f06e8a66a227725059a93b6534bad899cbe31c \
            --title "Hyundai Battery Insight 0.1.12" \
            --notes-file release-notes.md
