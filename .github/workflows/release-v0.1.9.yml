name: Publish v0.1.9 release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v0.1.9.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create v0.1.9 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          First public release candidate of Hyundai Battery Insight.

          Developed and tested with:
          - Hyundai Tucson PHEV, model year 2025
          - Home Assistant OS
          - Hyundai / Kia Connect

          Highlights:
          - Correlates 12V battery level, HV Battery Level and odometer data.
          - Keeps raw CCS2 snapshots distinct from Home Assistant historical correlation.
          - Does not directly wake the vehicle or call Hyundai/Bluelink.
          - Adds recoverable VIN-derived protection for complete raw vehicle payloads stored in SQLite.
          - Migrates legacy plaintext raw payloads from older local installations.
          - Adds manual Raw backup and Raw restore with merge-by-timestamp behavior.
          - Adds 1, 7, 14, 30, 60 and 90 day timeline ranges.
          - Includes original Battery Insight app/repository artwork.
          - Includes documentation, security guidance and automated validation.

          Status: experimental.

          The project is independent and is not affiliated with or endorsed by Hyundai, Kia, Home Assistant, or the Hyundai / Kia Connect project.
          EOF

          gh release create v0.1.9 \
            --repo "$GITHUB_REPOSITORY" \
            --target 17c4ad4ea188a45f28b5a15285d0bb7bccd8c6a1 \
            --title "Hyundai Battery Insight 0.1.9" \
            --notes-file release-notes.md
