name: Hyundai Battery Insight
version: "0.1.8"
slug: hyundai_battery_insight
description: >-
  Correlates Hyundai/Kia CCS2 12V SoC, HV Battery Level, odometer and fresh vehicle
  snapshots without waking the car.
url: https://github.com/rvdheuvel72/Hyundai-Battery-Insight
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:car-battery
homeassistant_api: true
backup: cold
stage: experimental
options:
  raw_entity: sensor.tucson_data_2
  aux_soc_entity: auto
  hv_battery_entity: auto
  odometer_entity: auto
  lookback_days: 120
  poll_seconds: 300
  import_on_start: true
schema:
  raw_entity: str
  aux_soc_entity: str
  hv_battery_entity: str
  odometer_entity: str
  lookback_days: int(7,365)
  poll_seconds: int(60,3600)
  import_on_start: bool
